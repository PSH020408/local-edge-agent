# Stage 7 device test set: battery and performance questions answered by the device agent.
#
# scenario: a state built from the outputs recorded on this Mac (evals/device/scenarios.py), so the
#           expected diagnosis is known; "live" runs on the Mac as it is, graded against the readings
#           the run records.
# route:    expected topic: battery, performance or none (not a device question).
# expect:   findings that must be in the diagnosis; forbid: findings that must not be.
# keys:     strings the answer should contain (numbers from the facts, as code formats them).
#
# Automatic checks per case: route, expected and forbidden findings, keys in the answer, numbers in
# the answer that are not in the facts, answer written by the model or by the code template, time.
# Each answer is also read and graded by hand against the facts (✅ / ⚠️ / ❌), as in Stages 4-6.
#
# Predictions, written before the first run:
# - routing: all rule cases right; the general-knowledge questions (R03, R04) and the questions
#   without a keyword (B15) go to qwen3:1.7b, which may miss one.
# - findings: all scenario cases right (the rules are code and the scenarios were checked offline).
# - answers by qwen3:4b: most copy the numbers; a few are rewritten once; Korean answers may drop the
#   less important findings. Expect 1-3 answers built by the template.
# - time: battery under 5 s with the small model warm; performance about 10 s of capture + 2-4 s.

