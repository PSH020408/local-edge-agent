# Fourth holdout for the document planner: two one-column papers never used during development,
# with equations, tables and figures (medical image reconstruction, biomedical signal processing).
# Run ONCE, after the code is frozen and committed, and do not change the code because of these results:
#     python scripts/run_eval_set.py --set documents --cases evals/documents/holdout4.toml --fast
# The files are kept in evals/documents/files/ (not committed).
#
# expect: key facts that a correct answer contains. One entry may list alternatives separated by " | ".
# avoid:  text that signals a wrong or invented claim.
# pages:  the pages that hold the answer.
#
# Known before the run (written down while preparing the questions, not fixed):
# - The MRI paper splits into 104 passages, so the passage index keeps only the 80 best keyword
#   matches; Korean questions share few words with the English text.
# - Its Table 1 comes out of the text layer with rows run together ("0.07CG-SENSE 1.63 ..."), so
#   reading one cell (MR8) depends on the model untangling the row.
# - "3 × 10−4" (a negative exponent) is not marked as a superscript (MR5).
# - The ECG paper's Figure 4 is a bar chart with no numbers in the text; only the vision model
#   can answer BS9, and the values it reads are approximate.

# --- Prior-guided physics-informed 4D MRI reconstruction (41 pages incl. supplement, one column) ---

[[case]]
id = "MR1"
file = "mri_4d_reconstruction.pdf"
question = "PGPI4MR가 뭐고, 어떤 두 가지 MRI 재구성 작업에 쓰여?"
expect = ["prior | 사전", "unrolled | 언롤", "4D", "sub-second | 1초 미만 | 서브세컨드 | 0.29"]
avoid = []
pages = [2, 3]
note = "Prior-guided, physics-informed 4D MRI reconstruction: one unrolled network for respiratory-resolved 4D MRI (16 phases) and sub-second 3D MRI (0.29-0.49 s windows) with a setup-scan prior."

[[case]]
id = "MR2"
file = "mri_4d_reconstruction.pdf"
question = "Write the forward model of equation (1) in LaTeX and explain what each operator in A does."
expect = ["y = Ax + n | y = A x + n | y=Ax+n | y = \\mathbf{A}", "MFS | M F S", "coil", "Fourier"]
avoid = []
pages = [4]
note = "y = Ax + n, A = MFS: S applies the coil maps, F is the 2D Fourier transform over the 2 phase-encoding axes, M selects the sampled points, n is noise."

[[case]]
id = "MR3"
file = "mri_4d_reconstruction.pdf"
question = "재구성 네트워크는 두 단계를 몇 번 반복하고, regularizer는 어떤 구조이며, data-consistency 단계는 어떻게 계산해?"
expect = ["5", "U-Net", "32", "conjugate | 켤레 | CG", "3"]
avoid = []
pages = [4]
note = "Repeats 2 steps 5 times; regularizer: residual U-Net with 3 levels and 32 base channels, shared by all iterations; data consistency: 3 conjugate-gradient iterations with a learned weight µk."

[[case]]
id = "MR4"
file = "mri_4d_reconstruction.pdf"
question = "In equation (3), what do φ, α and ᾱ stand for?"
expect = ["motion field | field", "breathing amplitude | amplitude", "mean | average"]
avoid = []
pages = [5]
note = "u(r) = (α − ᾱ) φ(r): φ is one motion field per volunteer, α the window's breathing amplitude, ᾱ the mean amplitude of the setup scan."

[[case]]
id = "MR5"
file = "mri_4d_reconstruction.pdf"
question = "4D 네트워크 학습에 쓴 optimizer, learning rate, step 수, 그리고 교차검증 구성은?"
expect = ["Adam", "3 × 10−4 | 3 × 10^-4 | 3e-4 | 3×10−4 | 0.0003 | 3 \\times 10^{-4} | 3 × 10^{-4}", "2,000 | 2000", "5 | five"]
avoid = []
pages = [5]
note = "Adam, learning rate 3 × 10^-4 with cosine decay, 2,000 steps; 5-fold cross-validation with 8 training and 2 test volunteers."

[[case]]
id = "MR6"
file = "mri_4d_reconstruction.pdf"
question = "What was the primary end point, and what was its result?"
expect = ["9.1", "8.1", "10.2", "60 s | 60s"]
avoid = []
pages = [7, 2]
note = "The 4D-versus-3D reduction at 60 s: coupling the 16 phases lowered the held-out error by 9.1% (95% CI, 8.1%-10.2%; P < 0.001)."

[[case]]
id = "MR7"
file = "mri_4d_reconstruction.pdf"
question = "Blackwell GPU에서 0.29 s 윈도우의 median 재구성 시간과 가장 느린 윈도우의 acquisition+reconstruction 시간은?"
expect = ["135", "0.455"]
avoid = []
pages = [7]
note = "Median reconstruction 135 ms; slowest window 0.455 s, under 0.5 s in every window."

[[case]]
id = "MR8"
file = "mri_4d_reconstruction.pdf"
question = "표 1에서 4D MRI 60 s일 때 PGPI4MR의 held-out k-space error와 Ada/Blackwell 재구성 시간은?"
expect = ["1.30", "13.0", "7.5"]
avoid = []
pages = [15]
note = "PGPI4MR (4D, phases coupled): 1.30 ± 0.08 at 60 s; 13.0 s on Ada and 7.5 s on Blackwell."

[[case]]
id = "MR9"
file = "mri_4d_reconstruction.pdf"
question = "이 연구가 밝힌 한계 네 가지는?"
expect = ["healthy | 건강", "setup | 셋업 | 설정 스캔", "true image | 참 영상 | 실제 영상 | 진짜 영상 | ground truth", "8"]
avoid = []
pages = [9]
note = "Healthy volunteers without tumors and one scanner/sequence; sub-second volumes depend on the setup prior (motion beyond its range underestimated); true images unknown; networks trained on 8 volunteers with settings tuned partly on later test volunteers."

[[case]]
id = "MH1"
file = "mri_4d_reconstruction.pdf"
question = "What tumor-tracking error in millimetres does the paper report for cancer patients?"
expect = ["not | no "]
avoid = ["tracking error was", "tracking error of"]
pages = []
note = "No patients were studied; target-tracking error is named as the end point for future patient studies."

# --- PulseNet: canine ECG classification (18 pages, one column) ---

[[case]]
id = "BS1"
file = "pulsenet_canine_ecg.pdf"
question = "이 논문은 개의 ECG를 어떤 과정으로 정상/비정상 분류해?"
expect = ["8", "Lead II", "wavelet | 웨이블릿 | scalogram | 스칼로그램", "CNN | 합성곱"]
avoid = []
pages = [1]
note = "8-second Lead II sequences, randomly augmented with RandAugmentECG for training, converted by a continuous wavelet transform into 2D scalograms, classified by a binary CNN."

[[case]]
id = "BS2"
file = "pulsenet_canine_ecg.pdf"
question = "How many DICOM files were used, at what sampling rate, and how many 8-second sequences were extracted?"
expect = ["1462", "500", "222,847 | 222847"]
avoid = []
pages = [2, 4]
note = "1462 DICOM files with 6 or 12 leads at 500 Hz; 222,847 sequences of 8 seconds."

[[case]]
id = "BS3"
file = "pulsenet_canine_ecg.pdf"
question = "Which mother wavelet is used for the scalograms, why, and how is it defined?"
expect = ["Ricker", "Mexican hat", "second derivative", "Gaussian"]
avoid = []
pages = [7]
note = "The Ricker (Mexican hat) wavelet, which somewhat mimics the ECG shape; the second derivative of a Gaussian."

[[case]]
id = "BS4"
file = "pulsenet_canine_ecg.pdf"
question = "RandAugmentECG의 n과 m은 무엇을 정하고, 학습 데이터에는 어떤 값을 썼어?"
expect = ["n", "m", "magnitude | 크기 | 강도 | 세기", "5"]
avoid = []
pages = [6, 7]
note = "n: the maximum number of transforms applied; m: the magnitude of the change; training used n = 5, m = 5 (Figure 5 shows n = 3, m = 5)."

[[case]]
id = "BS5"
file = "pulsenet_canine_ecg.pdf"
question = "Table 1에서 ResNet50, R 모델, M 모델의 최대 AUC는 각각 얼마야?"
expect = ["0.922", "0.941", "0.951"]
avoid = []
pages = [8]
note = "ResNet50 0.922, R model 0.941, M model 0.951."

[[case]]
id = "BS6"
file = "pulsenet_canine_ecg.pdf"
question = "In Table 3, what are the kernel size and number of features of the M model's first Conv2d layer, and which pooling does the model use?"
expect = ["7 x 7 | 7x7 | 7 × 7", "128", "Average | AvgPool"]
avoid = []
pages = [10, 8]
note = "Layer1 Conv2d 7 x 7, stride 1, 128 features; average pooling (AvgPool2d) instead of max pooling, and an adaptive max pool before the classifier."

[[case]]
id = "BS7"
file = "pulsenet_canine_ecg.pdf"
question = "학습에 쓴 optimizer, learning rate, weight decay, epoch 수, batch size는?"
expect = ["Adam", "3e-4 | 3 × 10", "0.2", "100", "110", "80"]
avoid = []
pages = [10]
note = "Adam, initial learning rate 3e-4, weight decay 0.2, 100 epochs, batch size 110 (M) and 80 (R), gradient accumulation every 3 mini batches."

[[case]]
id = "BS8"
file = "pulsenet_canine_ecg.pdf"
question = "What AUC, F1, recall and accuracy did the best model reach on the gold dataset, and how does it compare with the cardiologists?"
expect = ["0.9506", "89,28 | 89.28", "92,5 | 92.5", "91,95 | 91.95"]
avoid = []
pages = [11]
note = "AUC 0.9506, F1 89.28%, precision 86.28%, recall 92.5%, accuracy 91.95%; on par with 2 cardiologists in F1 and better than 2 in recall and accuracy."

[[case]]
id = "BS9"
file = "pulsenet_canine_ecg.pdf"
question = "Figure 4의 라벨 분포 그래프에서 가장 많은 라벨과 두 번째로 많은 라벨은 뭐야?"
expect = ["NORMAL | 정상 | normal", "SUPRAVENTRICULAR | Supraventricular | supraventricular | 상심실"]
avoid = []
pages = [5]
note = "Bar chart: NORMAL about 118,000, SUPRAVENTRICULAR about 41,000, VENTRICULAR about 36,000. Values only in the figure."

[[case]]
id = "BS10"
file = "pulsenet_canine_ecg.pdf"
question = "이 논문을 다섯 줄로 요약해 줘."
expect = ["ECG", "wavelet | 웨이블릿 | scalogram | 스칼로그램", "CNN | 합성곱 | M 모델 | M model", "0.95", "Azure"]
avoid = []
pages = []
note = "Canine ECG normal/abnormal classification; RandAugmentECG; CWT scalograms; custom M and R CNNs, AUC 0.9506 against three cardiologists; deployment on Microsoft Azure with MLOps."

[[case]]
id = "BH1"
file = "pulsenet_canine_ecg.pdf"
question = "What accuracy does the model reach on feline (cat) ECGs?"
expect = ["not | no "]
avoid = []
pages = []
note = "Only canine ECGs are studied."
