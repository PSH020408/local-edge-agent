# --- Deep learning: Transformer I (11 slides, English, a figure on every slide) ---

[[case]]
id = "GC1"
file = "dl_transformer_lecture.pdf"
question = "What disadvantages of RNNs does the lecture list, and what advantage does the Transformer have?"
expect = ["slow | GPU", "vanishing | exploding", "parallel"]
avoid = []
pages = [3]
note = "RNNs: slow to train, no parallel GPU use; vanishing/exploding gradients on long sequences. Transformer: all words at once, faster, parallelizable."

[[case]]
id = "GC2"
file = "dl_transformer_lecture.pdf"
question = "Write the positional encoding formulas shown in the slides."
expect = ["sin", "cos", "10000", "d_model | d_{model} | d_{\\text{model}} | dmodel"]
avoid = []
pages = [7]
note = "PE(pos,2i) = sin(pos / 10000^(2i/d_model)), PE(pos,2i+1) = cos(pos / 10000^(2i/d_model)). The formulas are an image; the text layer has only garbled symbols."

[[case]]
id = "GC3"
file = "dl_transformer_lecture.pdf"
question = "In the attention example, which word does 'dog' attend to most, and with what weight?"
expect = ["0.91"]
avoid = []
pages = [8]
note = "'dog' attends most to itself, 0.91 (vector [0.03 0.03 0.03 0.91]). The numbers are only in the figure."

[[case]]
id = "GC4"
file = "dl_transformer_lecture.pdf"
question = "인코더 블록은 어떤 구성 요소로 이뤄지고 몇 번 반복돼?"
expect = ["Feed Forward | 피드포워드 | 피드 포워드", "Residual | 잔차", "Layer normalization | Layer Normalization | 레이어 정규화 | 층 정규화", "6"]
avoid = []
pages = [9]
note = "Feed-forward network (MLP), residual connection and layer normalization, output a context vector; repeated 6 times (N=6). Multi-head attention is in the figure."

[[case]]
id = "GC5"
file = "dl_transformer_lecture.pdf"
question = "디코더 마지막의 Linear와 Softmax는 무슨 역할이고, 생성은 언제 멈춰?"
expect = ["Linear", "Softmax", "확률 | probab", "EOS"]
avoid = []
pages = [10]
note = "Linear: a feed-forward layer the size of the output vocabulary; Softmax: probability distribution over output words; the most probable word is output; repeated until <EOS>."

