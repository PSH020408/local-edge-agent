# --- Synthetic charts and tables with known values ---

[[case]]
id = "SC1"
file = "synthetic_charts_raster.pdf"
question = "On page 1, what was Northwind's revenue in Q4 '25, and which quarter had the highest revenue?"
expect = ["476.9", "Q2 '26 | Q2 2026 | Q2'26", "503.8"]
avoid = []
pages = [1]
note = "Labelled bars: Q4 '25 476.9; highest Q2 '26 503.8."

[[case]]
id = "SC2"
file = "synthetic_charts_raster.pdf"
question = "From the chart on page 2, estimate Northwind's operating income in Q3 '25 and in Q2 '26."
expect = ["45 | 46 | 47 | 48 | 49 | 50", "93 | 94 | 95 | 96 | 97"]
avoid = []
pages = [2]
note = "No value labels; true values 48 and 95. An answer should say the values are read from the chart (approximate)."

[[case]]
id = "SC3"
file = "synthetic_charts_raster.pdf"
question = "In the revenue by segment chart on page 5, what was total revenue in 2025 and about how large was Cloud that year?"
expect = ["1,890 | 1890", "700 | 710 | 720 | 725 | 730 | 740 | 750"]
avoid = []
pages = [5]
note = "Totals are labelled (1,890); Cloud is a stacked segment without a label, true value 720."

[[case]]
id = "SC4"
file = "synthetic_charts_raster.pdf"
question = "On page 7, in which year was the operating margin highest, and what was the operating income that year in USD million?"
expect = ["2025", "14.0 | 14%", "264.6 | 265 | 264"]
avoid = []
pages = [7]
note = "Margin labelled 14.0% in 2025; revenue bar 1,890 (read from the left axis, unlabelled): 0.14 × 1,890 = 264.6."

[[case]]
id = "SC5"
file = "synthetic_charts_raster.pdf"
question = "8쪽 차트에서 영업적자인 사업부와 그 금액은?"
expect = ["가전", "0.6"]
avoid = []
pages = [8]
note = "가전 −0.6조원 (the only negative bar)."

[[case]]
id = "SC6"
file = "synthetic_charts_raster.pdf"
question = "Check the Contoso statement on page 10: are its 2025 subtotals consistent?"
expect = ["1,260 | 1260", "1,360 | 1360", "gross profit | Gross profit"]
avoid = ["are consistent", "all subtotals are correct"]
pages = [10]
note = "Gross profit 2025 is printed as 1,360 but 2,310 − 1,050 = 1,260; operating income 410 = 1,260 − 850. The table has one wrong subtotal on purpose."

