# Development set for Stage 6 (tables, financial statements and graphs).
#     python scripts/run_eval_set.py --set documents --cases evals/documents/tables.toml --fast
# The files are kept in evals/documents/files/ (not committed); the synthetic chart PDFs are written
# there by scripts/make_chart_set.py (true values in evals/charts/answers.toml).
#
# Development documents:
#   samsung_annual_2025_fs.pdf  24 pages cut from a 573-page Korean annual report (FY2025): sales by
#                               segment, product and region (p.1-5), summary financials (p.6-7), the
#                               consolidated statements (p.8-15), notes (p.16-21), segment note (p.22-24)
#   apple_10k_2025.pdf          a full US annual report (80 pages); page numbers are PDF pages
#   samsung_ir_2026q3.pdf       a Korean quarterly results deck with charts (16 pages)
#   hyundai_ir_2026q3.pdf       a Korean quarterly results deck with bar and waterfall charts (20 pages)
#   synthetic_charts_raster.pdf charts and tables as images only (no text layer)
#   synthetic_charts_vector.pdf the same pages with a text layer
# Held back for the Stage 6 holdout (not used here): sk_halfyear_2025.pdf, nvidia_10k_fy2026.pdf,
# nvidia_ir_q2fy27.pdf, lg_ir_2026q2.pdf, unisoc_baseband.pdf.
#
# Answers were written from the page images. Derived values (ratios, growth, sums) were computed in
# code from the printed figures. Units: the Korean statements are in 백만원 (million won), the IR decks
# in 조원 or 십억원, the 10-K in USD million.

# Predictions written before the baseline run (Stage 5 code, nothing built for Stage 6 yet):
# - Lookups in text-layer statements (TA1, TB1 net sales) are mostly right; the numbers are in the text.
# - Ratios and growth rates are done by the answer model in its head; expect rounding slips (TA2, TB1).
# - Chart labels of the decks are in the text layer, but which number belongs to which bar is lost;
#   answers that need that pairing (TC2, TD1, TD3) depend on the page description.
# - Raster charts go to the vision model only; unlabelled values (SC2, SC3) will be off and probably
#   not marked approximate.
# - The deliberately wrong subtotal (SC6) will not be noticed unless the question makes the model add.

# --- Korean annual report (statements) ---

[[case]]
id = "TA1"
file = "samsung_annual_2025_fs.pdf"
question = "제57기(2025년) 연결 기준 매출액, 영업이익, 당기순이익은 각각 얼마야?"
expect = ["333,605,938 | 333조 6,059억 | 333.6조 | 333조", "43,601,051 | 43조 6,010억 | 43.6조 | 43조", "45,206,805 | 45조 2,068억 | 45.2조 | 45조"]
avoid = []
pages = [6, 10]
note = "Revenue 333,605,938, operating profit 43,601,051, net income 45,206,805 (million won)."

[[case]]
id = "TA2"
file = "samsung_annual_2025_fs.pdf"
question = "제57기 연결 영업이익률(영업이익/매출액)을 계산해 줘."
expect = ["13.1 | 13.07"]
avoid = []
pages = [10]
note = "43,601,051 / 333,605,938 = 13.07%."

[[case]]
id = "TA3"
file = "samsung_annual_2025_fs.pdf"
question = "연결 재무상태표에서 제57기 자산총계가 부채총계와 자본총계의 합과 같은지 확인해 줘."
expect = ["566,942,110", "130,621,773", "436,320,337", "일치 | 같 | 맞"]
avoid = ["일치하지 않", "다릅니다"]
pages = [8, 9]
note = "130,621,773 + 436,320,337 = 566,942,110 = total assets."

[[case]]
id = "TA4"
file = "samsung_annual_2025_fs.pdf"
question = "제55기 법인세비용은 얼마였고, 숫자가 괄호로 표시된 이유는 뭐야?"
expect = ["4,480,835", "수익 | 음수 | 마이너스 | 부(-) | 환급 | benefit | 이익"]
avoid = []
pages = [10]
note = "(4,480,835): a negative tax expense, i.e. an income tax benefit (법인세수익), as the line name 법인세비용(수익) says."

[[case]]
id = "TA5"
file = "samsung_annual_2025_fs.pdf"
question = "제57기 영업활동현금흐름과 유형자산 취득액은? 둘의 차이(영업활동현금흐름 − 유형자산 취득)도 계산해 줘."
expect = ["85,315,148", "47,522,179", "37,792,969 | 37조 7,930억 | 37.8조"]
avoid = []
pages = [14]
note = "85,315,148 − 47,522,179 = 37,792,969 (million won)."

# --- US annual report (10-K) ---

[[case]]
id = "TB1"
file = "apple_10k_2025.pdf"
question = "What were Apple's total net sales and net income in fiscal 2025, and by what percent did net income grow from 2024?"
expect = ["416,161", "112,010", "19.5 | 19.49"]
avoid = []
pages = [32]
note = "Net sales 416,161; net income 112,010 vs 93,736 in 2024: +19.5%."

[[case]]
id = "TB2"
file = "apple_10k_2025.pdf"
question = "Check that Apple's total assets equal total liabilities plus shareholders' equity at September 27, 2025."
expect = ["359,241", "285,508", "73,733"]
avoid = ["do not equal", "does not equal"]
pages = [34]
note = "285,508 + 73,733 = 359,241."

[[case]]
id = "TB3"
file = "apple_10k_2025.pdf"
question = "What was Apple's total gross margin percentage in 2025, and how does it compare with 2024?"
expect = ["46.9", "46.2"]
avoid = []
pages = [27, 32]
note = "46.9% in 2025, 46.2% in 2024 (195,201 / 416,161)."

[[case]]
id = "TB4"
file = "apple_10k_2025.pdf"
question = "How much did Apple spend on share repurchases and on dividends in fiscal 2025, and how much in total?"
expect = ["90,711", "15,421", "106,132"]
avoid = []
pages = [36]
note = "Repurchases 90,711 + dividends and dividend equivalents 15,421 = 106,132 (USD million)."

# --- Korean results deck with charts ---

[[case]]
id = "TC1"
file = "samsung_ir_2026q3.pdf"
question = "2026년 3분기 사업 부문별 매출 차트에서 DS와 DX 매출은 각각 얼마이고, 전체 매출에서 DS 비중은 몇 %야?"
expect = ["147.1", "52.1", "75.3 | 75%"]
avoid = []
pages = [6, 13]
note = "DS 147.1조, DX 52.1조 of 195.3조: DS 75.3%."

[[case]]
id = "TC2"
file = "samsung_ir_2026q3.pdf"
question = "MX/NW 매출/영업이익 차트에서 영업이익이 적자였던 분기와 그 금액은?"
expect = ["0.7", "0.6", "2Q | 2분기", "3Q | 3분기"]
avoid = []
pages = [10, 13]
note = "2Q '26 −0.7조 and 3Q '26 −0.6조 (3Q '25 +3.6조)."

[[case]]
id = "TC3"
file = "samsung_ir_2026q3.pdf"
question = "3Q말 '26 부채비율을 요약재무상태의 부채와 자본으로 직접 계산해서 표에 적힌 비율과 비교해 줘."
expect = ["1,777,303", "6,141,116", "28.9 | 29"]
avoid = []
pages = [14]
note = "1,777,303 / 6,141,116 = 28.9%, printed as 29%."

[[case]]
id = "TC4"
file = "samsung_ir_2026q3.pdf"
question = "3분기 현금배당 총액과 보통주 주당 배당금은?"
expect = ["30", "4,601"]
avoid = []
pages = [15]
note = "30조원 in total; 4,601원 per common (and preferred) share."

