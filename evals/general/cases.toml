# General questions with known answers (experiment Q1: the model chosen per question).
#     python scripts/run_model_choice.py              (light, heavy and auto, one after another)
# level: what the question should be judged as (a check of agent/model_choice.py, not of the answer)
# expected: numbers that must appear in the answer (within 1%, or 0.05 for small values); contains: any of
#   these strings must appear (dates, weekdays). Answers computed independently when the set was written.

[[case]]
id = "L1"
level = "light"
question = "Convert 72 km/h to m/s."
expected = [20.0]

[[case]]
id = "L2"
level = "light"
question = "What is 15% of 240?"
expected = [36.0]

[[case]]
id = "L3"
level = "light"
question = "What date is 100 days after 2026-03-03?"
contains = ["2026-06-11", "June 11", "6월 11일"]

[[case]]
id = "L4"
level = "light"
question = "How many dBm is 1 W?"
expected = [30.0]

[[case]]
id = "L5"
level = "light"
question = "What is 2 to the power of 16?"
expected = [65536.0]

[[case]]
id = "L6"
level = "light"
question = "Convert 100 °F to °C."
expected = [37.78]

[[case]]
id = "L7"
level = "light"
question = "What weekday was 2026-01-01?"
contains = ["Thursday", "목요일"]

[[case]]
id = "L8"
level = "light"
