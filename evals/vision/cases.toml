# Vision test set for scripts/run_vision_set.py. Descriptions and full expected answers: cases.md.
#
# expect: key facts that a correct answer contains. One entry may list alternatives separated by " | ".
# avoid:  text that signals a hallucination or a wrong claim.
# The key-fact count is only a quick indicator; every answer is still read and scored by hand.

[[case]]
id = "01"
image = "01_esp32_schematic.jpg"
question = "What microcontroller module is this board built around? Which GPIO pins connect to the SD card (CS, MOSI, SCK, MISO) and to the OLED display (SDA, SCL)? What voltage regulator is used?"
expect = ["ESP-WROOM-32", "G05 | GPIO5 | IO5", "G23 | GPIO23 | IO23", "G18 | GPIO18 | IO18", "G19 | GPIO19 | IO19", "G21 | GPIO21 | IO21", "G22 | GPIO22 | IO22", "AMS1117-3V3 | AMS1117-3.3"]
avoid = ["G24"]
note = "SD: CS G05, MOSI G23, SCK G18, MISO G19. OLED: SDA G21, SCL G22. Regulator AMS1117-3V3."

[[case]]
id = "02"
image = "02_sheet_music_tab.png"
question = "What song is this sheet music for? Give the title, artist, instrument, tempo, key signature and the chords in the intro."
expect = ["Wonderwall", "Oasis", "Ukulele", "90", "three sharps | 3 sharps | A major | F# minor | F♯ minor | F#m | F♯m", "Esus4", "B7sus4"]
avoid = []
note = "Wonderwall, Oasis, Guitar/Ukulele, tempo 90, three sharps, intro F#m7 A Esus4 B7sus4."

[[case]]
id = "03"
image = "03_tweet_thread_en.jpg"
question = "Summarize this conversation. Who says what, and why is it funny?"
expect = ["Felder", "Fury", "face", "Fair enough", "Twitter | online"]
avoid = []
note = "The critic admits he only said it on Twitter because Felder would beat him; Felder accepts: 'Fair enough'."

[[case]]
id = "04"
image = "04_korean_comments.jpg"
question = "이 댓글들을 읽어 주고, 대화의 흐름과 왜 웃긴지 설명해 줘."
expect = ["어머니 마음 타들어가는 속도보다 빠를까", "너희 엄마랑 우리 엄마랑 대결해볼까", "비긴걸로하자 | 비긴 걸로 하자"]
avoid = ["상사", "시어머니", "단일 댓글", "single comment"]
note = "Four comments; a mom insult escalates into 'your mom vs my mom', and both settle for a draw."

[[case]]
id = "05"
image = "05_korean_infographic_finance.png"
question = "이 이미지는 무엇을 설명하는 자료야? 각 항목과 하위 내용을 정리해 줘."
expect = ["재무제표", "손익계산서", "재무상태표", "현금흐름표", "영업활동", "투자활동", "재무활동", "자산", "부채", "자본"]
avoid = []
note = "Three statements with their items, bar chart and icons."

[[case]]
id = "06"
image = "06_ber_chart.png"
question = "What does this chart show? Which modulation needs the lowest Eb/N0 to reach log10(Pb) = -6, and which needs the highest?"
expect = ["BPSK | QPSK | 4-QAM", "32-PSK"]
avoid = ["D-QPSK requires the highest", "is D-QPSK"]
note = "Lowest: BPSK / QPSK / 4-QAM (about 10.5 dB). Highest: 32-PSK (about 22 dB)."

[[case]]
id = "07"
image = "07_dft_formula.gif"
question = "Transcribe these formulas in LaTeX and explain what each one computes."
expect = ["X(k)", "x(n)", "1/N | \\frac{1}{N} | \\frac1N", "-j | −j", "IDFT | inverse"]
avoid = []
note = "DFT with -j in the exponent; IDFT with +j and 1/N."

[[case]]
id = "08"
image = "08_cartoon_scene.webp"
question = "What is happening in this picture? How does the character feel?"
expect = ["knee", "pain | hurt | injur"]
avoid = ["yawn"]
note = "A cartoon man sitting on the sidewalk clutching his knee in exaggerated pain."

[[case]]
id = "09"
image = "09_handwriting_sketch.jpg"
question = "Transcribe all the handwritten text exactly, then describe the drawing: style, character features and pose."
expect = ["handwriting", "손글씨", "저 손글씨 잘 못씁니다", "평소에는 이렇게 씁니다", "horn", "chibi"]
avoid = []
note = "Three 'handwriting 손글씨' samples and two Korean lines; chibi anime girl with dragon horns, one finger raised."

[[case]]
id = "10"
image = "10_night_street_photo.jpg"
question = "Describe this photo. Where and when was it likely taken? Read any signs you can see."
expect = ["푸르지오강남", "715-1544", "night"]
avoid = ["Seoul", "서울"]
note = "Night street; sign 푸르지오강남 (031)715-1544; no city named from the sign."

[[case]]
id = "11"
image = "11_aquarium.webp"
question = "Describe this aquarium. How many fish can you see, and what is in the layout?"
expect = ["driftwood | wood", "rock | stone", "plant"]
avoid = ["one fish", "One fish"]
note = "About 10 to 13 small fish; driftwood, dark rocks, stem and floating plants, black background."

[[case]]
id = "12"
image = "12_lecture_screen_photo.jpg"
question = "이 강의 화면의 제목과 주제를 읽어 줘. 읽을 수 없는 부분은 읽을 수 없다고 말해 줘."
expect = ["경영", "금융", "임용", "출제범위 | 출제 범위", "교과교육학"]
avoid = []
note = "Notice about changes to the exam scope; small body text is unreadable."

[[case]]
id = "H1"
image = "04_korean_comments.jpg"
question = "가장 추천을 많이 받은 댓글은 뭐야?"
expect = ["없 | 표시되지 | 보이지 | not shown"]
avoid = []
note = "No recommendation counts are shown."

[[case]]
id = "H2"
image = "06_ber_chart.png"
question = "What is the BER of 128-QAM at 10 dB?"
expect = ["not shown | not in | no curve | no entry | does not"]
avoid = []
note = "128-QAM is not in the chart."

[[case]]
id = "H3"
image = "01_esp32_schematic.jpg"
question = "What is the value of resistor R50?"
expect = ["not found | not shown | not in | no R50"]
avoid = ["kΩ", "ohm", "10k", "4.7k"]
note = "There is no R50."

[[case]]
id = "H4"
image = "11_aquarium.webp"
question = "What brand is the filter in this aquarium?"
expect = ["not shown | not visible | no brand | cannot"]
avoid = []
note = "No brand is visible."
